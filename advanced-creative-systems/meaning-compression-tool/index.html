<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meaning Compression Tool — Progressively densify text until meaning begins to collapse.">
  <title>Meaning Compression Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="cipher">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="app-shell">
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <h1 class="brand-title">Densitas</h1>
            <p class="brand-subtitle">Meaning Compression</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="theme-switcher" role="group" aria-label="Theme">
            <button class="theme-btn is-active" data-theme="cipher" aria-pressed="true" title="Cipher">
              <span class="theme-swatch cipher"></span>
              <span class="visually-hidden">Cipher</span>
            </button>
            <button class="theme-btn" data-theme="vellum" aria-pressed="false" title="Vellum">
              <span class="theme-swatch vellum"></span>
              <span class="visually-hidden">Vellum</span>
            </button>
            <button class="theme-btn" data-theme="terminal" aria-pressed="false" title="Terminal">
              <span class="theme-swatch terminal"></span>
              <span class="visually-hidden">Terminal</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content">
      <div class="layout">
        <section class="input-panel">
          <h2 class="panel-title">Source</h2>
          <p class="panel-desc">Paste an experience, paragraph, or note. Compression densifies it step by step until meaning starts to fail.</p>
          <textarea id="source-text" class="source-area" rows="8" placeholder="Paste or write a passage…"></textarea>
          <div class="param-row">
            <label class="field-label">Aesthetic</label>
            <div class="chip-group" id="aesthetic-chips" role="group"></div>
          </div>
          <div class="param-row">
            <label class="field-label" for="depth-range">Depth <span id="depth-val">3</span></label>
            <input type="range" id="depth-range" min="1" max="6" value="3">
            <div class="range-labels"><span>Gentle</span><span>Collapse edge</span></div>
          </div>
          <button type="button" class="btn btn-primary" id="btn-compress">Compress</button>
          <button type="button" class="btn btn-ghost" id="btn-sample">Load sample</button>
        </section>

        <section class="output-panel" aria-live="polite">
          <h2 class="panel-title">Layers</h2>
          <div class="empty-state" id="empty-state">
            <p>Compressed layers will stack here. Watch density rise and fidelity fall.</p>
          </div>
          <div class="layers" id="layers" hidden></div>
          <div class="collapse-meter" id="collapse-meter" hidden>
            <span class="meter-label">Meaning integrity</span>
            <div class="meter-track"><div class="meter-fill" id="integrity-fill"></div></div>
            <span class="meter-val" id="integrity-val">—</span>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
