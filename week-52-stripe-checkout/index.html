<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Stripe checkout demo"/><title>Payframe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Payframe</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow">Week 52 · Stripe Checkout</p>
  <h1>Secure checkout</h1>
  <p class="lead">Demo. Use test card <code>4242 4242 4242 4242</code>.</p>
  <div class="pay-layout">
    <form class="card" id="pay">
      <div class="field"><label>Email</label><input id="email" type="email" required value="buyer@example.com"/></div>
      <div class="field"><label>Card</label><input id="card" placeholder="4242 4242 4242 4242" required/></div>
      <div class="row"><div class="field"><label>Expiry</label><input id="exp" placeholder="12 / 34" required/></div>
      <div class="field"><label>CVC</label><input id="cvc" placeholder="123" required/></div></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Pay $144.19</button>
      <p id="status" style="display:none;margin-top:.75rem;font-size:.9rem"></p>
    </form>
    <aside class="card"><h2 style="margin:0 0 .75rem;font-family:var(--display);font-size:1.1rem">Order</h2>
      <div style="display:flex;justify-content:space-between;margin:.4rem 0"><span>Tote</span><span>$148</span></div>
      <div style="display:flex;justify-content:space-between;margin:.4rem 0;color:var(--muted)"><span>Discount</span><span>−$14.80</span></div>
      <div style="display:flex;justify-content:space-between;margin:.75rem 0 0;font-weight:800;border-top:1px solid var(--line);padding-top:.75rem"><span>Total</span><span>$144.19</span></div>
    </aside>
  </div>
</main>

<footer class="site-footer"><div class="inner"><span>Phase 6 · E-commerce</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
