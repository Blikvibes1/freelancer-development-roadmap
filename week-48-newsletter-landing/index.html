<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Newsletter landing"/><title>Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Dispatch</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow" style="text-align:center">Week 48 · Newsletter</p>
  <section class="hero48">
    <h1>Ship better client work every week</h1>
    <p class="lead" style="margin-left:auto;margin-right:auto">Frontend notes for freelancers — systems, proposals, polished UI.</p>
    <form class="form48" id="nl"><input id="email" type="email" required placeholder="you@studio.com"/><button class="btn btn-primary" type="submit">Join Dispatch</button></form>
    <p id="nl-status" style="display:none;margin-top:1rem;color:var(--ok)"></p>
  </section>
  <div class="perks">
    <article class="card"><h3 style="margin:.4rem 0">Patterns</h3><p style="margin:0;color:var(--muted);font-size:.9rem">Reusable UI recipes.</p></article>
    <article class="card"><h3 style="margin:.4rem 0">Pricing</h3><p style="margin:0;color:var(--muted);font-size:.9rem">Scoping $2k–$10k sites.</p></article>
    <article class="card"><h3 style="margin:.4rem 0">Critique</h3><p style="margin:0;color:var(--muted);font-size:.9rem">Monthly portfolio teardown.</p></article>
  </div>
</main>

<footer class="site-footer"><div class="inner"><span>Freelancer roadmap</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
