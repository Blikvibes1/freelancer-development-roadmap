<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Feed — Instagram-style infinite scroll with Intersection Observer, skeletons, and Theme Mode." />
  <title>Feed — Infinite Scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#feed">Skip to feed</a>

  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Feed home">
        <span class="brand__mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <rect x="4" y="4" width="18" height="18" rx="4" class="brand-frame"/>
            <circle cx="13" cy="13" r="4" class="brand-core"/>
          </svg>
        </span>
        <span class="brand__name">Feed</span>
      </a>
      <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch to Lumen theme">
        <span class="theme-switch__track">
          <span class="theme-switch__thumb">
            <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
        </span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Week 20 · Infinite Scroll Feed</p>
      <h1 class="hero__title">Scroll. Load. Repeat.</h1>
      <p class="hero__text">An Instagram-style feed that loads more mock posts as you reach the bottom. Intersection Observer, no libraries.</p>
    </section>

    <section class="feed-section">
      <div class="feed" id="feed" aria-live="polite" aria-relevant="additions"></div>
      <div class="sentinel" id="sentinel" aria-hidden="true"></div>
      <div class="loading" id="loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading more…</span>
      </div>
      <p class="end-msg" id="end-msg" hidden>You’re all caught up.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Feed · Week 20 · Phase 2 complete · Freelancer Development Program</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
