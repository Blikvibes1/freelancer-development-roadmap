<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Abandoned cart recovery"/><title>Nudge</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Nudge</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow">Week 59 · Abandoned Cart</p>
  <h1>Recover lost carts</h1>
  <div class="layout">
    <section class="card"><h2 style="margin:0 0 .75rem;font-family:var(--display);font-size:1.1rem">Sessions</h2><div id="sessions"></div>
      <button class="btn" type="button" id="seed" style="margin-top:.75rem">Simulate abandoned cart</button></section>
    <section class="card"><h2 style="margin:0 0 .75rem;font-family:var(--display);font-size:1.1rem">Recovery queue</h2>
      <button class="btn btn-primary" type="button" id="run">Run recovery job</button>
      <div id="queue" style="margin-top:.75rem"></div></section>
  </div>
</main>

<footer class="site-footer"><div class="inner"><span>Phase 6 · E-commerce</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
