<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis — Security Headers</title>
  <style>
    :root {
      --bg: #0b0d12; --card: #141822; --text: #eef0f5; --muted: #9aa0ae;
      --accent: #38bdf8; --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.35rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem;
    }
    button {
      padding: 0.55rem 0.9rem; border: none; border-radius: 0.4rem;
      background: var(--accent); color: #0b0d12; font: inherit; font-weight: 700;
      cursor: pointer; margin-bottom: 0.75rem;
    }
    pre {
      font-size: 0.78rem; overflow: auto; white-space: pre-wrap;
      background: var(--bg); padding: 0.75rem; border-radius: 0.4rem;
    }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <h1>Aegis — Security headers</h1>
  <p>Week 40 · Helmet configures CSP, frameguard, nosniff, and more on every response.</p>

  <div class="card">
    <button type="button" id="load">Fetch /api/security-headers</button>
    <pre id="out">Click the button to inspect applied headers.</pre>
  </div>

  <div class="card">
    <p style="margin:0">From a terminal:</p>
    <pre style="margin-top:0.5rem">curl -I http://localhost:3000/</pre>
  </div>

  <script>
    document.getElementById("load").onclick = async () => {
      const res = await fetch("/api/security-headers");
      const json = await res.json();
      document.getElementById("out").textContent = JSON.stringify(json, null, 2);
    };
  </script>
</body>
</html>
