<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Order email"/><title>Receipt</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Receipt</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow">Week 56 · Order Email</p>
  <h1>Receipt preview</h1>
  <div style="text-align:center;margin:1rem 0"><button class="btn btn-primary" type="button" id="send">Send receipt</button>
  <p id="status" style="display:none;margin-top:.6rem;color:var(--ok)"></p></div>
  <div class="email"><div class="email-head"><strong>Thanks for your order</strong><div style="opacity:.9;font-size:.9rem">Order #1042</div></div>
  <div class="email-body"><table>
    <tr><td>Noir Leather Tote × 1</td><td style="text-align:right">$148.00</td></tr>
    <tr><td>Lumen Silk Scarf × 1</td><td style="text-align:right">$64.00</td></tr>
    <tr><td><strong>Total</strong></td><td style="text-align:right"><strong>$229.49</strong></td></tr>
  </table></div></div>
</main>

<footer class="site-footer"><div class="inner"><span>Phase 6 · E-commerce</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
