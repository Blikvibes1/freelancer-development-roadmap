<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Keyring</title>
  <style>
    :root {
      --bg: #0b0d12; --card: #141822; --text: #eef0f5; --muted: #9aa0ae;
      --accent: #3b82f6; --border: rgba(255,255,255,0.08); --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(100%, 22rem); background: var(--card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 1.75rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.35rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 0.65rem 0.75rem; margin-bottom: 1rem;
      border-radius: 0.5rem; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font: inherit;
    }
    button {
      width: 100%; padding: 0.7rem; border: none; border-radius: 0.5rem;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
    .msg.error { color: var(--danger); }
    .msg.ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p id="subtitle">Choose a password with at least 8 characters.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="8" required autocomplete="new-password" />
      <button type="submit" id="submit">Update password</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");
    const subtitle = document.getElementById("subtitle");

    async function validate() {
      if (!token) {
        form.hidden = true;
        subtitle.textContent = "Missing reset token.";
        msg.className = "msg error";
        msg.textContent = "Open the link from your email.";
        return;
      }
      const res = await fetch("/api/auth/reset-password/validate?token=" + encodeURIComponent(token));
      const data = await res.json();
      if (!res.ok) {
        form.hidden = true;
        msg.className = "msg error";
        msg.textContent = data.error?.message || "Invalid link";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        msg.className = "msg error";
        msg.textContent = "Passwords do not match.";
        return;
      }
      document.getElementById("submit").disabled = true;
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.className = "msg error";
        msg.textContent = data.error?.message || "Failed";
        document.getElementById("submit").disabled = false;
        return;
      }
      msg.className = "msg ok";
      msg.textContent = data.data.message;
      form.hidden = true;
    });

    validate();
  </script>
</body>
</html>
