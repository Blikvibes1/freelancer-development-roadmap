<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Event ticketing landing"/><title>Summit Stage</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Summit Stage</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow">Week 45 · Event Ticketing</p>
  <div class="hero-event">
    <span class="badge">Oct 24 · Downtown Hall</span>
    <h1 style="margin-top:.5rem">Frontend Systems Summit</h1>
    <p class="lead">Design systems, performance, and shipping client work.</p>
    <div class="countdown" id="countdown"></div>
  </div>
  <div class="layout45">
    <section><h2 style="font-family:var(--display);font-size:1.2rem">Speakers</h2><div class="speakers" id="speakers"></div></section>
    <aside class="card">
      <h2 style="margin:0 0 .75rem;font-family:var(--display);font-size:1.1rem">Register</h2>
      <form id="reg">
        <div class="field"><label>Name</label><input id="rname" required/></div>
        <div class="field"><label>Email</label><input id="remail" type="email" required/></div>
        <div class="field"><label>Ticket</label><select id="rticket"><option value="GA">General · $89</option><option value="PRO">Pro · $149</option></select></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Get ticket</button>
      </form>
      <p id="rstatus" style="display:none;margin-top:.75rem;color:var(--ok);font-size:.9rem"></p>
    </aside>
  </div>
</main>

<footer class="site-footer"><div class="inner"><span>Freelancer roadmap</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
