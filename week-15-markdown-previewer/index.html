<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ink — Split-screen Markdown previewer with live render and Theme Mode." />
  <title>Ink — Markdown Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#editor">Skip to editor</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Ink home">
        <span class="brand__mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <rect x="5" y="4" width="16" height="18" rx="2" class="brand-frame"/>
            <path d="M9 10h8M9 14h6M9 18h4" class="brand-lines" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand__name">Ink</span>
      </a>
      <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch to Lumen theme">
        <span class="theme-switch__track"><span class="theme-switch__thumb">
          <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </span></span>
      </button>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Week 15 · Markdown Previewer</p>
      <h1 class="hero__title">Write left. See right.</h1>
      <p class="hero__text">Type Markdown and watch it render live. No libraries — pure JS parser for common syntax.</p>
    </section>
    <section class="workspace">
      <div class="pane">
        <div class="pane__header">Markdown</div>
        <textarea id="editor" class="editor" spellcheck="false" aria-label="Markdown editor"># Welcome to Ink

Type **Markdown** on the left and see it render on the right.

## Features
- Headings
- **Bold** and *italic*
- `inline code`
- Lists
- [Links](https://example.com)
- > Blockquotes

```
code blocks
```

Enjoy writing.
</textarea>
      </div>
      <div class="pane">
        <div class="pane__header">Preview</div>
        <div id="preview" class="preview" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>Ink · Week 15 · Freelancer Development Program</p></footer>
  <script src="script.js"></script>
</body>
</html>
