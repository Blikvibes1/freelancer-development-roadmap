<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Inventory dashboard"/><title>Stockroom</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#">Stockroom</a>
    <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch theme">
      <span class="theme-switch__track"><span class="theme-switch__thumb">
        <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/></svg>
      </span></span>
    </button>
  </div></header>

<main id="main" class="wrap">
  <p class="eyebrow">Week 57 · Inventory</p>
  <h1>Stock control</h1>
  <div class="stats" id="stats"></div>
  <div class="card"><table><thead><tr><th>Product</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <form class="card" id="add" style="margin-top:1rem">
    <h2 style="margin:0 0 .75rem;font-family:var(--display);font-size:1.05rem">Add product</h2>
    <div style="display:grid;grid-template-columns:1fr 100px auto;gap:.5rem;align-items:end">
      <div class="field" style="margin:0"><label>Name</label><input id="n" required/></div>
      <div class="field" style="margin:0"><label>Stock</label><input id="q" type="number" min="0" value="10" required/></div>
      <button class="btn btn-primary" type="submit">Add</button>
    </div>
  </form>
</main>

<footer class="site-footer"><div class="inner"><span>Phase 6 · E-commerce</span><span>Theme Mode</span></div></footer>
<script src="script.js"></script>
</body></html>
