<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Typeflow — Typing speed test with WPM, accuracy, and error highlighting." />
  <title>Typeflow — Typing Speed Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#test">Skip to test</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Typeflow home">
        <span class="brand__mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <rect x="4" y="7" width="18" height="12" rx="2" class="brand-frame"/>
            <path d="M8 16h2M12 16h2M16 16h2" class="brand-keys" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand__name">Typeflow</span>
      </a>
      <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch to Lumen theme">
        <span class="theme-switch__track"><span class="theme-switch__thumb">
          <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </span></span>
      </button>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Week 18 · Typing Speed Test</p>
      <h1 class="hero__title">Measure your flow</h1>
      <p class="hero__text">Type the passage below. Track WPM, accuracy, and errors in real time.</p>
    </section>
    <section class="test" id="test">
      <div class="stats">
        <div class="stat"><span class="stat__value" id="wpm">0</span><span class="stat__label">WPM</span></div>
        <div class="stat"><span class="stat__value" id="accuracy">100</span><span class="stat__label">Accuracy %</span></div>
        <div class="stat"><span class="stat__value" id="errors">0</span><span class="stat__label">Errors</span></div>
        <div class="stat"><span class="stat__value" id="time">0</span><span class="stat__label">Seconds</span></div>
      </div>
      <div class="card">
        <div class="passage" id="passage" aria-label="Text to type"></div>
        <textarea id="input" class="input" rows="3" placeholder="Start typing here…" aria-label="Typing input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="actions">
          <button type="button" class="btn btn--primary" id="btn-restart">Restart</button>
          <button type="button" class="btn btn--ghost" id="btn-new">New passage</button>
        </div>
        <p class="done-msg" id="done-msg" hidden>Finished — see your stats above.</p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>Typeflow · Week 18 · Freelancer Development Program</p></footer>
  <script src="script.js"></script>
</body>
</html>
