<!DOCTYPE html>
<html lang="en" data-theme="noir">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flux — Live currency converter with multi-currency support and Theme Mode." />
  <title>Flux — Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#converter">Skip to converter</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Flux home">
        <span class="brand__mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <circle cx="13" cy="13" r="11" class="brand-ring"/>
            <path d="M9 13h8M13 9l4 4-4 4" class="brand-arrow" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand__name">Flux</span>
      </a>
      <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Switch to Lumen theme">
        <span class="theme-switch__track"><span class="theme-switch__thumb">
          <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </span></span>
      </button>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Week 14 · Currency Converter</p>
      <h1 class="hero__title">Convert with live rates</h1>
      <p class="hero__text">Real-time exchange rates. Swap currencies. See the math instantly.</p>
    </section>
    <section class="converter" id="converter">
      <div class="card">
        <div class="field">
          <label class="field__label" for="amount">Amount</label>
          <input type="number" id="amount" class="field__input" value="100" min="0" step="any" />
        </div>
        <div class="pair">
          <div class="field">
            <label class="field__label" for="from">From</label>
            <select id="from" class="field__input field__select"></select>
          </div>
          <button type="button" class="swap-btn" id="swap" aria-label="Swap currencies">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
          </button>
          <div class="field">
            <label class="field__label" for="to">To</label>
            <select id="to" class="field__input field__select"></select>
          </div>
        </div>
        <div class="result" id="result" aria-live="polite">
          <p class="result__main" id="result-main">—</p>
          <p class="result__rate" id="result-rate">Loading rates…</p>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>Flux · Week 14 · Rates via Frankfurter · Freelancer Development Program</p></footer>
  <script src="script.js"></script>
</body>
</html>
